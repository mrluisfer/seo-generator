<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Applies the saved theme before first paint so a dark-mode user never
			// sees a white flash. Keep the key in sync with src/lib/state/theme.svelte.ts.
			try {
				var m = localStorage.getItem('seo-generator:theme');
				if (m === 'light' || m === 'dark') document.documentElement.dataset.theme = m;
			} catch (e) {
				/* storage blocked — fall through to the OS preference */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
