<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="head — SEO metadata, compiled">
  <rect width="1200" height="630" fill="#fbfbf9"/>
  <rect x="0" y="0" width="1200" height="6" fill="#17181b"/>

  <g font-family="IBM Plex Mono, Menlo, Consolas, monospace">
    <text x="90" y="250" font-size="104" font-weight="500" fill="#17181b">
      <tspan fill="#8e9198">&lt;</tspan>head<tspan fill="#8e9198">&gt;</tspan>
    </text>
    <text x="94" y="312" font-size="30" letter-spacing="2" fill="#5c5f66">metadata, compiled</text>
  </g>

  <g font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
    <text x="92" y="404" font-size="32" fill="#17181b">One document. Nine framework targets.</text>
    <text x="92" y="450" font-size="27" fill="#5c5f66">Measured in pixels, the way search results truncate.</text>
  </g>

  <!-- The measure gauge: the one idea the tool is built on. -->
  <g transform="translate(92 520)">
    <rect width="1016" height="7" rx="3.5" fill="#f2f2ee"/>
    <rect width="762" height="7" rx="3.5" fill="#35704f"/>
    <rect x="846" y="-5" width="2" height="17" fill="#cdcdc5"/>
    <text x="0" y="46" font-family="IBM Plex Mono, Menlo, monospace" font-size="21" fill="#8e9198">
      505px / 600px
    </text>
  </g>
</svg>
